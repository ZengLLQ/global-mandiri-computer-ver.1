[package]
name = "gmc-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "import_catalog"
path = "src/bin/import_catalog.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "compression-full", "trace", "fs", "limit"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.18", features = ["derive"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
uuid = { version = "1.8", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
calamine = "0.26"
csv = "1.3"
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }
thiserror = "1.0"
regex = "1.10"
anyhow = "1.0"
axum-extra = { version = "0.9", features = ["cookie"] }
rand = "0.8"
totp-rs = { version = "6.0", default-features = false, features = ["alloc", "std", "gen_secret", "otpauth", "serde"] }
ammonia = "4.2.1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
